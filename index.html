<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Portal - Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #2d2d2d;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            width: 300px;
            text-align: center;
        }
        h2 { color: #55ff55; }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 4px;
        }
        button {
            width: 95%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #218838; }
        .toggle-btn {
            background: none;
            border: none;
            color: #aaa;
            margin-top: 15px;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container" id="auth-box">
    <h2 id="form-title">Minecraft Login</h2>
    <input type="text" id="username" placeholder="Minecraft Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="handleAuth()" id="submit-btn">Login</button>
    <br>
    <button class="toggle-btn" onclick="toggleForm()" id="toggle-text">Need an account? Register</button>
</div>

<script>
    let isLogin = true;

    function toggleForm() {
        isLogin = !isLogin;
        document.getElementById('form-title').innerText = isLogin ? 'Minecraft Login' : 'Minecraft Register';
        document.getElementById('submit-btn').innerText = isLogin ? 'Login' : 'Register';
        document.getElementById('toggle-text').innerText = isLogin ? "Need an account? Register" : "Already have an account? Login";
    }

    function handleAuth() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!username || !password) {
            alert('Please fill in all fields!');
            return;
        }

        if (isLogin) {
            // Login Check
            const savedPassword = localStorage.getItem(username);
            if (savedPassword && savedPassword === password) {
                alert('Welcome back, ' + username + '!');
                // Logged in logic here
            } else {
                alert('Invalid username or password!');
            }
        } else {
            // Register Logic
            if (localStorage.getItem(username)) {
                alert('Username already exists!');
            } else {
                localStorage.setItem(username, password);
                alert('Account created successfully! You can now login.');
                toggleForm();
            }
        }
    }
</script>

</body>
</html>
